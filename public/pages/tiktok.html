<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTok Downloader — MK</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body {
      background: #010108;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(105,201,208,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(254,44,85,0.1) 0%, transparent 50%);
    }
    .navbar { background: rgba(1,1,8,0.92); }
    .btn-fetch  { background: linear-gradient(135deg, #69c9d0, #ee1d52); color: white; }
    .btn-download { background: linear-gradient(135deg, #69c9d0, #ee1d52); color: white; }
    .platform-icon { background: rgba(105,201,208,0.1); border: 1px solid rgba(105,201,208,0.25); }
    .q-btn.active { border-color: #69c9d0; color: #69c9d0; }
  </style>
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/">
    <div class="nav-logo-icon">MK</div>
    <div class="nav-logo-text">MK Universal Downloader<span>TikTok</span></div>
  </a>
  <button class="burger" id="burger"><span></span><span></span><span></span></button>
</nav>
<div class="dropdown" id="dropdown">
  <a href="https://mrkanha.likesyou.org" target="_blank">👨‍💻 Contact Developer</a>
  <a href="/">🏠 Home</a>
</div>

<div class="page-wrap">
  <div class="container">
    <div class="page-hero">
      <div class="platform-icon" style="font-size:28px; width:64px; height:64px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; border-radius:16px;">🎵</div>
      <h1>TikTok Downloader</h1>
      <p>No watermark · HD quality</p>
    </div>

    <div class="card">
      <div class="input-group">
        <input id="urlInput" type="url" placeholder="https://www.tiktok.com/@user/video/..."/>
        <button class="btn-fetch" id="btnFetch">Get Info</button>
      </div>

      <div class="quality-row">
        <button class="q-btn active" data-q="best">No Watermark</button>
        <button class="q-btn" data-q="audio">Audio Only</button>
      </div>

      <div class="preview-box" id="preview">
        <img class="preview-thumb" id="previewThumb" src="" alt="thumb"/>
        <div class="preview-info">
          <div class="preview-title" id="previewTitle"></div>
          <div class="preview-meta" id="previewMeta"></div>
          <span class="clean-badge" id="cleanBadge" style="display:none">✓ Tracking removed</span>
        </div>
      </div>

      <button class="btn-download" id="btnDownload">⬇ Download</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>initDownloader({ platform: 'tiktok' });</script>
</body>
</html>
