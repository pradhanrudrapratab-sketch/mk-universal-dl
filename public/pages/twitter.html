<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Twitter / X Downloader — MK</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body {
      background: #000000;
      background-image:
        radial-gradient(ellipse at 40% 10%, rgba(255,255,255,0.05) 0%, transparent 50%);
    }
    .navbar { background: rgba(0,0,0,0.92); border-bottom-color: rgba(255,255,255,0.08); }
    .btn-fetch  { background: #e7e7e7; color: #000; }
    .btn-download { background: #e7e7e7; color: #000; font-weight: 700; }
    .platform-icon { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); }
    .q-btn.active { border-color: #fff; color: white; }
    .card { border-color: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/">
    <div class="nav-logo-icon">MK</div>
    <div class="nav-logo-text">MK Universal Downloader<span>Twitter / X</span></div>
  </a>
  <button class="burger" id="burger"><span></span><span></span><span></span></button>
</nav>
<div class="dropdown" id="dropdown">
  <a href="https://mrkanha.likesyou.org" target="_blank">👨‍💻 Contact Developer</a>
  <a href="/">🏠 Home</a>
</div>

<div class="page-wrap">
  <div class="container">
    <div class="page-hero">
      <div class="platform-icon" style="font-size:28px; width:64px; height:64px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; border-radius:16px;">𝕏</div>
      <h1>Twitter / X Downloader</h1>
      <p>Download Videos and GIFs from Twitter / X</p>
    </div>

    <div class="card">
      <div class="input-group">
        <input id="urlInput" type="url" placeholder="https://twitter.com/... or x.com/..."/>
        <button class="btn-fetch" id="btnFetch">Get Info</button>
      </div>

      <div class="quality-row">
        <button class="q-btn active" data-q="best">Best Quality</button>
        <button class="q-btn" data-q="720">720p</button>
        <button class="q-btn" data-q="480">480p</button>
      </div>

      <div class="preview-box" id="preview">
        <img class="preview-thumb" id="previewThumb" src="" alt="thumb"/>
        <div class="preview-info">
          <div class="preview-title" id="previewTitle"></div>
          <div class="preview-meta" id="previewMeta"></div>
          <span class="clean-badge" id="cleanBadge" style="display:none">✓ Tracking removed</span>
        </div>
      </div>

      <button class="btn-download" id="btnDownload">⬇ Download</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>initDownloader({ platform: 'twitter' });</script>
</body>
</html>
