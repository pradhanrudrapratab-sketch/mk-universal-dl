<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Downloader — MK</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body {
      background: #0d0000;
      background-image:
        radial-gradient(ellipse at 30% 0%, rgba(255,0,0,0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(180,0,0,0.12) 0%, transparent 50%);
    }
    .navbar { background: rgba(13,0,0,0.85); }
    .btn-fetch { background: #ff0000; color: white; }
    .btn-download { background: #ff0000; color: white; }
    .platform-icon { background: rgba(255,0,0,0.15); border: 1px solid rgba(255,0,0,0.3); color: white; }
    .q-btn.active { border-color: #ff0000; color: #ff6666; }
    .clean-badge { background: rgba(255,0,0,0.1); color: #ff6666; border-color: rgba(255,0,0,0.3); }
  </style>
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/">
    <div class="nav-logo-icon">MK</div>
    <div class="nav-logo-text">MK Universal Downloader<span>YouTube</span></div>
  </a>
  <button class="burger" id="burger"><span></span><span></span><span></span></button>
</nav>
<div class="dropdown" id="dropdown">
  <a href="https://mrkanha.likesyou.org" target="_blank">👨‍💻 Contact Developer</a>
  <a href="/">🏠 Home</a>
</div>

<div class="page-wrap">
  <div class="container">
    <div class="page-hero">
      <div class="platform-icon">▶️</div>
      <h1>YouTube Downloader</h1>
      <p>Paste any YouTube link — tracking removed automatically</p>
    </div>

    <div class="card">
      <div class="input-group">
        <input id="urlInput" type="url" placeholder="https://youtu.be/... or youtube.com/watch?v=..."/>
        <button class="btn-fetch" id="btnFetch">Get Info</button>
      </div>

      <div class="quality-row">
        <button class="q-btn active" data-q="best">Best</button>
        <button class="q-btn" data-q="720">720p</button>
        <button class="q-btn" data-q="480">480p</button>
        <button class="q-btn" data-q="audio">Audio Only</button>
      </div>

      <div class="preview-box" id="preview">
        <img class="preview-thumb" id="previewThumb" src="" alt="thumb"/>
        <div class="preview-info">
          <div class="preview-title" id="previewTitle"></div>
          <div class="preview-meta" id="previewMeta"></div>
          <span class="clean-badge" id="cleanBadge" style="display:none">✓ Tracking removed</span>
        </div>
      </div>

      <button class="btn-download" id="btnDownload">⬇ Download</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>initDownloader({ platform: 'youtube' });</script>
</body>
</html>
